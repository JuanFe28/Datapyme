{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow accent-label">ADMINISTRACIÓN</span><h1>Usuarios y acceso</h1><p>Cuentas individuales, permisos en servidor y sesiones revocables.</p></div></div><details class="panel-card form-card"><summary class="details-title">Crear usuario</summary><form method="post" class="gap-top"><input type="hidden" name="csrf_token" value="{{csrf}}"><div class="form-grid"><label class="form-field">Usuario<input name="username" required pattern="[a-zA-Z0-9_.-]{3,60}" maxlength="60" autocomplete="off"></label><label class="form-field">Contraseña inicial<input name="password" type="password" required minlength="12" maxlength="512" autocomplete="new-password"></label><label class="form-field">Rol<select name="role"><option value="campo">Investigador</option><option value="admin">Administrador</option></select></label></div><div class="form-actions"><button type="submit" class="btn btn-primary">Crear cuenta</button></div></form></details><div class="tasks-stack gap-top">{% for u in users %}<form method="post" action="/usuarios/{{u.id}}" class="panel-card form-card"><input type="hidden" name="csrf_token" value="{{csrf}}"><h2>{{u.username}}</h2><div class="form-grid"><label class="form-field">Rol<select name="role"><option value="campo" {{'selected' if u.role=='campo'}}>Investigador</option><option value="admin" {{'selected' if u.role=='admin'}}>Administrador</option></select></label><label class="form-field">Nueva contraseña (opcional)<input type="password" name="password" minlength="12" maxlength="512" autocomplete="new-password"></label><label class="consent-field"><input type="checkbox" name="active" value="yes" {{'checked' if u.active}}><span>Cuenta activa</span></label></div><div class="form-actions"><small>Guardar revoca todas las sesiones anteriores de esta cuenta.</small><button class="btn btn-outline" type="submit">Actualizar acceso</button></div></form>{% endfor %}</div>{% endblock %}
