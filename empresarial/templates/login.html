<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ingresar · Datapyme Empresarial</title>
  <link rel="stylesheet" href="{{ root_path | default('') }}/static/css/tokens.css">
  <style>
    /* Critical Inline Fallback & Auth Ergonomics (Apple HIG + Impeccable) */
    :root {
      --surface-canvas: #F8FAFC;
      --surface-card: #FFFFFF;
      --surface-subtle: #F1F5F9;
      --ink-primary: #0F172A;
      --ink-secondary: #475569;
      --ink-muted: #64748B;
      --accent-primary: #0D7A6F;
      --accent-primary-hover: #0A635A;
      --status-danger-bg: #FEF2F2;
      --status-danger-text: #991B1B;
      --status-danger-border: #FECACA;
      --radius-control: 8px;
      --radius-modal: 16px;
      --shadow-md: 0 0 0 1px rgba(15, 23, 42, 0.06), 0 12px 32px -4px rgba(15, 23, 42, 0.08);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--surface-canvas);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .login-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(13, 122, 111, 0.08), transparent),
        var(--surface-canvas);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface-card);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: var(--radius-modal);
      box-shadow: var(--shadow-md);
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
    }

    .login-brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #0D7A6F, #0A635A);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(13, 122, 111, 0.22);
    }

    .login-title {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      color: var(--ink-primary);
      letter-spacing: -0.025em;
    }

    .login-subtitle {
      margin: 6px 0 24px;
      color: var(--ink-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-secondary);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      font-family: inherit;
      font-size: 14px;
      color: var(--ink-primary);
      background-color: #FFFFFF;
      border: 1px solid rgba(15, 23, 42, 0.16);
      border-radius: var(--radius-control);
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .form-group input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(13, 122, 111, 0.16);
    }

    .form-error {
      background: var(--status-danger-bg);
      color: var(--status-danger-text);
      border: 1px solid var(--status-danger-border);
      padding: 10px 14px;
      border-radius: var(--radius-control);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .login-btn-submit {
      width: 100%;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
      background: var(--accent-primary);
      border: 1px solid var(--accent-primary);
      border-radius: var(--radius-control);
      cursor: pointer;
      margin-top: 8px;
      transition: all 160ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-btn-submit:hover {
      background: var(--accent-primary-hover);
      border-color: var(--accent-primary-hover);
    }

    .login-btn-submit:active {
      transform: scale(0.985);
    }

    .login-demo-section {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid rgba(15, 23, 42, 0.08);
    }

    .login-demo-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-muted);
      margin-bottom: 10px;
      display: block;
    }

    .login-demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .login-demo-pill {
      appearance: none;
      background: var(--surface-subtle);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: var(--radius-control);
      padding: 8px 10px;
      cursor: pointer;
      text-align: left;
      transition: all 140ms ease;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-family: inherit;
    }

    .login-demo-pill:hover {
      background: #FFFFFF;
      border-color: rgba(13, 122, 111, 0.35);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    .login-demo-pill:active {
      transform: scale(0.98);
    }

    .login-demo-pill strong {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .login-demo-pill span {
      font-size: 11px;
      color: var(--ink-muted);
    }

    .login-footer-meta {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-muted);
    }

    @media (max-width: 480px) {
      .login-shell {
        padding: 16px 12px;
      }
      .login-card {
        padding: 24px 18px;
        border-radius: 12px;
      }
      .login-demo-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .login-btn-submit {
        min-height: 46px;
      }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <div class="login-card">
      <div class="login-brand-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
      </div>

      <h1 class="login-title">Datapyme Empresarial</h1>
      <p class="login-subtitle">
        Analítica comercial para PyMEs de Bucaramanga · Entorno de validación
      </p>

      {% if error %}
      <div class="form-error" role="alert" data-testid="login-error">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" action="{{ root_path | default('') }}/login" autocomplete="on">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="username"
            placeholder="gerencia@comercio.co"
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            minlength="10"
            autocomplete="current-password"
            placeholder="••••••••••••"
          >
        </div>

        <button class="btn btn-primary login-btn-submit" type="submit">
          Ingresar a la plataforma
        </button>
      </form>

      <div class="login-demo-section">
        <span class="login-demo-label">Cuentas demo de prueba (F-DC-125)</span>
        <div class="login-demo-grid">
          <button
            type="button"
            class="login-demo-pill"
            data-demo-email="demo.ferreteria@datapyme.co"
            data-demo-pass="DemoFerreteria2026!"
          >
            <strong>Ferretería Cabecera</strong>
            <span>Foco Inventario · M07/M08</span>
          </button>

          <button
            type="button"
            class="login-demo-pill"
            data-demo-email="demo.boutique@datapyme.co"
            data-demo-pass="DemoBoutique2026!"
          >
            <strong>Boutique San Pío</strong>
            <span>Foco Ventas · M10/M12</span>
          </button>

          <button
            type="button"
            class="login-demo-pill"
            data-demo-email="demo.minimercado@datapyme.co"
            data-demo-pass="DemoMinimercado2026!"
          >
            <strong>Minimercado Real</strong>
            <span>Foco Predictivo · M17</span>
          </button>

          <button
            type="button"
            class="login-demo-pill"
            data-demo-email="superadmin.demo@datapyme.co"
            data-demo-pass="SuperAdmin2026!"
          >
            <strong>Auditor UTS</strong>
            <span>SuperAdmin Telemetría</span>
          </button>
        </div>
      </div>
    </div>

    <div class="login-footer-meta">
      Unidades Tecnológicas de Santander · Validación de Software F-DC-124 / F-DC-125
    </div>
  </main>

  <script src="{{ root_path | default('') }}/static/js/login.js" defer></script>
</body>
</html>
