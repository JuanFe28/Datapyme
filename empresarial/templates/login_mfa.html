<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Verificación en Dos Pasos · Datapyme Empresarial</title>
  <link rel="stylesheet" href="{{ root_path | default('') }}/static/css/tokens.css">
  <style>
    .mfa-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(13, 122, 111, 0.08), transparent),
        var(--surface-canvas);
    }
    .mfa-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface-card);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: var(--radius-modal);
      box-shadow: var(--shadow-md);
      padding: 36px 32px;
    }
    .code-input {
      width: 100%;
      height: 52px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.18em;
      border-radius: var(--radius-control);
      border: 1px solid rgba(15, 23, 42, 0.18);
      background: #FFFFFF;
      color: var(--ink-primary);
    }
    .code-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(13, 122, 111, 0.14);
    }
  </style>
</head>
<body>
  <main class="mfa-shell">
    <div class="mfa-card">
      <div class="login-brand-mark" aria-hidden="true" style="width: 44px; height: 44px; border-radius: 11px; background: var(--accent-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; margin-bottom: 18px;">
        2FA
      </div>

      <h1 class="login-title" style="margin-top: 0;">Verificación en Dos Pasos</h1>
      <p class="login-subtitle">
        Ingresa el código temporal de 6 dígitos generado por tu app autenticadora{% if account_hint %} para <strong>{{ account_hint }}</strong>{% endif %}, o uno de tus códigos de recuperación.
      </p>

      {% if error %}
      <div class="form-error" role="alert" data-testid="mfa-error" style="margin-bottom: 16px;">
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" action="{{ root_path | default('') }}/login/mfa">
        <div class="form-group">
          <label for="mfa-code">Código de verificación (6 dígitos o código de respaldo)</label>
          <input
            id="mfa-code"
            name="code"
            type="text"
            class="code-input"
            required
            autofocus
            autocomplete="one-time-code"
            placeholder="000000"
            maxlength="16"
          >
        </div>

        <button class="btn btn-primary login-btn-submit" type="submit" id="btn-verify-mfa">
          Confirmar e Ingresar
        </button>
      </form>

      <div style="margin-top: 16px; text-align: center;">
        <a href="{{ root_path | default('') }}/login" style="font-size: 13px; color: var(--ink-muted); text-decoration: none;">
          Volver a iniciar sesión con otra cuenta
        </a>
      </div>
    </div>
  </main>
</body>
</html>
